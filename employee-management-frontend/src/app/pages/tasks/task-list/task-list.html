<div class="d-flex justify-content-between align-items-center mb-3">

    <h2>Tasks</h2>

    <a
        routerLink="/tasks/new"
        class="btn btn-primary">

        Add Task

    </a>

</div>


<div class="table-responsive">

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Task</th>

                <th>Description</th>

                <th>Priority</th>

                <th>Status</th>

                <th>Project</th>

                <th>Assigned To</th>

                <th>Actions</th>

            </tr>

        </thead>


        <tbody>

            @for (
                task of tasks;
                track task.id
            ) {

                <tr>

                    <td>
                        {{ task.id }}
                    </td>

                    <td>
                        {{ task.title }}
                    </td>

                    <td>
                        {{ task.description }}
                    </td>

                    <td>
                        {{ task.priority }}
                    </td>

                    <td>
                        {{ task.status }}
                    </td>

                    <td>
                        {{ task.projectName }}
                    </td>

                    <td>
                        {{ task.assignedToName }}
                    </td>

                    <td>

                        <a
                            [routerLink]="[
                                '/tasks/edit',
                                task.id
                            ]"
                            class="btn btn-sm btn-warning me-2">

                            Edit

                        </a>


                        <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            (click)="deleteTask(task.id)">

                            Delete

                        </button>

                    </td>

                </tr>

            }

        </tbody>

    </table>

</div>
